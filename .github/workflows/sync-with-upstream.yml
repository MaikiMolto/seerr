name: Sync Fork with Upstream

on:
  schedule:
    # Täglich 04:00 UTC = 06:00 MESZ (vor dem 06:00-Heartbeat)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to rebase on (default: develop)'
        default: 'develop'
        required: false

concurrency:
  group: sync-with-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upstream_tag: ${{ steps.tag.outputs.tag }}
      conflict: ${{ steps.rebase.outcome == 'failure' }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # GH_PAT statt GITHUB_TOKEN, damit Push danach den Build-Workflow triggert
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git
          # --force damit clobber-Tags (z.B. preview-*) nicht den Sync killen
          git fetch --tags --force upstream

      - name: Get upstream latest tag
        id: tag
        run: |
          tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo 'unknown')
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "Upstream latest tag: $tag"

      - name: Check if rebase needed
        id: check
        run: |
          BEHIND=$(git rev-list --count develop..upstream/${{ inputs.upstream_ref || 'develop' }})
          AHEAD=$(git rev-list --count upstream/${{ inputs.upstream_ref || 'develop' }}..develop)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "develop is $BEHIND commits behind upstream/${{ inputs.upstream_ref || 'develop' }} and $AHEAD commits ahead"
          if [ "$BEHIND" -eq "0" ]; then
            echo "already_up_to_date=true" >> $GITHUB_OUTPUT
          else
            echo "already_up_to_date=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebase develop on upstream/${{ inputs.upstream_ref || 'develop' }}
        id: rebase
        if: steps.check.outputs.already_up_to_date == 'false'
        run: |
          git rebase upstream/${{ inputs.upstream_ref || 'develop' }}

      - name: Push develop (force-with-lease)
        if: steps.rebase.outcome == 'success'
        run: |
          git push origin develop --force-with-lease

      - name: Notify success via Telegram
        if: steps.rebase.outcome == 'success' && steps.check.outputs.behind != '0'
        run: |
          MSG="🟢 Seerr-Fork synced!%0A%0AUpstream: ${{ steps.tag.outputs.tag }}%0AHinten gewesen: ${{ steps.check.outputs.behind }} commits%0A%0ABuild-Workflow startet jetzt automatisch — danach Image in Dockhand redeployen."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null

      - name: Notify already up-to-date
        if: steps.check.outputs.already_up_to_date == 'true'
        run: |
          echo "✅ develop is already up-to-date with upstream — no sync needed"

      - name: Abort rebase on conflict
        if: failure() && steps.rebase.outcome == 'failure'
        run: git rebase --abort || true

      - name: Notify conflict via Telegram
        if: failure() && steps.rebase.outcome == 'failure'
        run: |
          MSG="🚨 Seerr-Fork-Sync FAIL%0A%0AKonflikt beim Rebase auf upstream %2F main.%0AManueller Eingriff nötig!%0A%0AWorkflow: https://github.com/MaikiMolto/seerr/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null
